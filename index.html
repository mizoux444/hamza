<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mizoux TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --yacine-red: #e50914;
    --yacine-dark-red: #8b0000;
    --bg-main: #0c0c0e;
    --bg-sidebar: #141418;
    --bg-card: #1f1f25;
    --bg-card-hover: #2a2a32;
    --text-color: #ffffff;
    --text-muted: #9ca3af;
}

*{
    box-sizing: border-box;
    font-family: 'Cairo', Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body{
    margin: 0;
    padding: 0;
    background: var(--bg-main);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
}

header{
    background: linear-gradient(135deg, var(--yacine-dark-red), #050505);
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--yacine-red);
}

header h1{
    margin:0;
    font-size:1.1rem;
    font-weight:800;
}

header h1 span{
    background: var(--yacine-red);
    padding:1px 6px;
    border-radius:4px;
}

.search-container input{
    width:140px;
    padding:6px;
    border-radius:6px;
    border:1px solid #333;
    background:#000;
    color:#fff;
}

.player-container{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    position:sticky;
    top:0;
}

video{
    width:100%;
    height:100%;
}

.tabs-container{
    display:flex;
    overflow-x:auto;
    background:#101014;
    padding:10px;
    gap:8px;
}

.tab-button{
    background:var(--bg-card);
    color:var(--text-muted);
    padding:6px 14px;
    border-radius:20px;
    border:1px solid #27272a;
    cursor:pointer;
}

.tab-button.active{
    background:var(--yacine-red);
    color:#fff;
}

.channels-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:10px;
}

.channel-card{
    background:var(--bg-card);
    padding:10px;
    border-radius:8px;
    text-align:center;
    cursor:pointer;
}

.channel-card.active{
    background:var(--yacine-red);
}
</style>
</head>

<body>

<header>
<h1>Mizoux <span>TV</span></h1>
<div class="search-container">
<input type="text" id="searchChannel" placeholder="بحث...">
</div>
</header>

<div class="player-container">
<video id="video" controls autoplay playsinline></video>
</div>

<div class="tabs-container" id="tabs"></div>
<div id="list"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
let video=document.getElementById("video");
let hls;

const GITHUB_JSON_URL="https://raw.githubusercontent.com/mizoux444/hamza/main/channels.json";

function play(url,el){
document.querySelectorAll('.channel-card').forEach(e=>e.classList.remove('active'));
if(el) el.classList.add('active');

if(Hls.isSupported()){
if(hls) hls.destroy();
hls=new Hls();
hls.loadSource(url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}else{
video.src=url;
video.play();
}
}

async function loadChannels(){
let res=await fetch(GITHUB_JSON_URL);
let data=await res.json();
render(data);
}

function render(channels){
let tabs=document.getElementById("tabs");
let list=document.getElementById("list");

channels.forEach(cat=>{
let btn=document.createElement("button");
btn.innerText=cat.name;
btn.className="tab-button";
tabs.appendChild(btn);

let grid=document.createElement("div");
grid.className="channels-grid";

cat.list.forEach(ch=>{
let card=document.createElement("div");
card.className="channel-card";
card.innerHTML=ch.name;
card.onclick=()=>play(ch.url,card);
grid.appendChild(card);
});

list.appendChild(grid);
});
}

loadChannels();
</script>

</body>
</html>
